[project]
name = "edu-notify"
version = "0.1.0"
description = "교육 안내 메일·문자 발송 자동화"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.60.1",
    "pdfplumber>=0.11.10",
    "pypdf>=6.1.3",
    "reportlab>=4.4.4",
]

[project.optional-dependencies]
dev = ["pypdfium2>=5.12.1", "pillow>=11.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_notify"]
